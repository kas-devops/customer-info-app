name: Deploy to Databricks

on:
  push:
    branches: [develop, release, main]

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Copy build into backend
        run: cp -r frontend/dist databricks-deploy/app/dist
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DEV_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DEV_DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t dev
      - name: Deploy app
        env:
          DATABRICKS_HOST: ${{ secrets.DEV_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DEV_DATABRICKS_TOKEN }}
        run: databricks apps deploy customer-info-app --source-code-path /Workspace/Users/kasthu.cloud@gmail.com/.bundle/customer-info-app/dev/files/databricks-deploy/app

  deploy-qa:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Copy build into backend
        run: cp -r frontend/dist databricks-deploy/app/dist
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.QA_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.QA_DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t qa
      - name: Deploy app
        env:
          DATABRICKS_HOST: ${{ secrets.QA_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.QA_DATABRICKS_TOKEN }}
        run: databricks apps deploy customer-info-app-qa --source-code-path /Workspace/Users/kasthu.cloud@gmail.com/.bundle/customer-info-app/qa/files/databricks-deploy/app

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Copy build into backend
        run: cp -r frontend/dist databricks-deploy/app/dist
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t prod
      - name: Deploy app
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
        run: databricks apps deploy customer-info-app-prod --source-code-path /Workspace/Users/kasthu.cloud@gmail.com/.bundle/customer-info-app/prod/files/databricks-deploy/app